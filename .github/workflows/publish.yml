name: Publish NuGet Packages

on:
  push:
    branches: [master]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          # Get current version
          CURRENT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # For workflow_dispatch, always publish
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - will publish"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get previous version
          git show HEAD~1:Directory.Build.props > /tmp/prev_props.xml 2>/dev/null || true
          if [ -f /tmp/prev_props.xml ]; then
            PREVIOUS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' /tmp/prev_props.xml || echo "")
            echo "Previous version: $PREVIOUS_VERSION"

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version found - will publish"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build-and-publish:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --project Model.Tests --configuration Release --no-build --verbosity normal
          dotnet test --project Importers.Interfaces.Tests --configuration Release --no-build --verbosity normal
          dotnet test --project Importers.Xpln.Tests --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Model.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Interfaces.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Services.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Model.Databases.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Xpln.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Summary
        run: |
          echo "## Published packages v${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Model" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Interfaces" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Services" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Model.Databases" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Xpln" >> $GITHUB_STEP_SUMMARY
