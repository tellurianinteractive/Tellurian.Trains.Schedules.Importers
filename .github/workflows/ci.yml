name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Check version
        id: version
        run: |
          CURRENT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # For workflow_dispatch or PRs, don't trigger publish
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - will publish"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request - won't publish"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if version changed from previous commit
          git show HEAD~1:Directory.Build.props > /tmp/prev_props.xml 2>/dev/null || true
          if [ -f /tmp/prev_props.xml ]; then
            PREVIOUS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' /tmp/prev_props.xml || echo "")
            echo "Previous version: $PREVIOUS_VERSION"

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version found - will publish"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Make test executables runnable
        run: find . -type f -path '*/bin/Release/net10.0/*' -name '*.Tests' -exec chmod +x {} +

      - name: Test Model
        run: dotnet test Model.Tests/Model.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test Importers.Interfaces
        run: dotnet test Importers.Interfaces.Tests/Interfaces.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test Importers.Xpln
        run: dotnet test Importers.Xpln.Tests/Xpln.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test Planning.Components
        run: dotnet test Planning.Components.Tests/Planning.Components.Tests.csproj --configuration Release --no-build --verbosity normal

  publish:
    needs: [build, test]
    if: needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Model.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Interfaces.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Services.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Model.Databases.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkgs/Tellurian.Trains.Schedules.Importers.Xpln.*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Summary
        run: |
          echo "## Published packages v${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Model" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Interfaces" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Services" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Model.Databases" >> $GITHUB_STEP_SUMMARY
          echo "- Tellurian.Trains.Schedules.Importers.Xpln" >> $GITHUB_STEP_SUMMARY
